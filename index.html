<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO Meta Tags -->
  <title>Record Drift — Discover Music by Country, Decade &amp; Genre</title>
  <meta name="title" content="Record Drift — Discover Music by Country, Decade &amp; Genre" />
  <meta name="description" content="Spin an interactive 3D globe to discover real albums and local artists from any country, decade, and genre. Explore global music scenes with Record Drift." />
  <link rel="canonical" href="https://recorddrift.com/" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph / Facebook / Discord / WhatsApp Preview -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://recorddrift.com/" />
  <meta property="og:site_name" content="Record Drift" />
  <meta property="og:title" content="Record Drift — Discover Music by Country, Decade &amp; Genre" />
  <meta property="og:description" content="Spin an interactive 3D globe to discover real albums and local artists from any country, decade, and genre." />
  <meta property="og:image" content="https://recorddrift.com/preview.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter / X Card Preview -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://recorddrift.com/" />
  <meta name="twitter:title" content="Record Drift — Discover Music by Country, Decade &amp; Genre" />
  <meta name="twitter:description" content="Spin an interactive 3D globe to discover real albums and local artists from any country, decade, and genre." />
  <meta name="twitter:image" content="https://recorddrift.com/preview.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="globe-container"></div>

  <!-- Top Header -->
  <header class="top-bar">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true">
        <span class="vinyl-ring"></span>
      </div>
      <div>
        <div class="brand-title-row">
          <h1>RECORD DRIFT</h1>
          <span id="api-status-badge" class="status-badge live" title="Connected to live MusicBrainz database">● LIVE API</span>
        </div>
        <p class="subtitle">Spin the globe · Filter by country, decade &amp; genre</p>
      </div>
    </div>

    <div class="header-actions">
      <button id="random-country-btn" class="btn btn-secondary" title="Pick a random country">
        🎲 Random Country
      </button>
      <button id="drift-btn" class="btn btn-primary">
        🎧 Drift Record
      </button>
    </div>
  </header>

  <!-- Filter Control Panel -->
  <aside class="control-panel" aria-label="Music discovery filters">
    <div class="control-group">
      <label for="country-select">Country / Region</label>
      <select id="country-select">
        <option value="ALL">🌍 Any Country (Global)</option>
      </select>
    </div>

    <div class="control-group">
      <label for="decade-select">Decade</label>
      <select id="decade-select">
        <option value="ALL">All Decades</option>
        <option value="1960s">1960s</option>
        <option value="1970s">1970s</option>
        <option value="1980s">1980s</option>
        <option value="1990s">1990s</option>
        <option value="2000s">2000s</option>
        <option value="2010s">2010s</option>
        <option value="2020s">2020s</option>
      </select>
    </div>

    <div class="control-group">
      <label for="genre-select">Genre</label>
      <select id="genre-select">
        <option value="ALL">All Genres</option>
      </select>
    </div>

    <div class="filter-footer">
      <span id="match-count">Loading catalog...</span>
      <button id="reset-filters-btn" class="link-btn">Reset</button>
    </div>
  </aside>

  <!-- Selected Album Card -->
  <section id="album-card" class="album-card hidden" aria-live="polite">
    <button id="close-card-btn" class="close-btn" aria-label="Close album details">✕</button>

    <div class="album-card-header">
      <div class="album-cover-wrap">
        <img id="album-cover" src="" alt="Album cover art" />
        <div id="album-cover-fallback" class="cover-fallback hidden">
          <span class="vinyl-disc"></span>
        </div>
      </div>

      <div class="album-meta">
        <div class="badges">
          <span id="album-country-badge" class="badge badge-country">Country</span>
          <span id="album-year-badge" class="badge badge-year">Year</span>
          <span id="album-genre-badge" class="badge badge-genre">Genre</span>
        </div>
        <h2 id="album-title">Album Title</h2>
        <p id="album-artist" class="artist-name">Artist Name</p>
      </div>
    </div>

    <p id="album-description" class="album-description"></p>

    <div class="album-links">
      <a id="listen-youtube" href="#" target="_blank" rel="noopener noreferrer" class="stream-btn yt">
        ▶ YouTube
      </a>
      <a id="listen-spotify" href="#" target="_blank" rel="noopener noreferrer" class="stream-btn sp">
        ● Spotify
      </a>
      <a id="listen-mb" href="#" target="_blank" rel="noopener noreferrer" class="stream-btn mb">
        ↗ MusicBrainz
      </a>
    </div>

    <div class="card-actions">
      <button id="next-match-btn" class="btn btn-primary full-width">
        ↻ Another Record From This Filter
      </button>
    </div>
  </section>

  <!-- Loading / Toast Notification -->
  <div id="toast" class="toast hidden" role="status"></div>

  <!-- Globe Interaction Hint -->
  <div class="globe-hint">
    Drag to spin · Scroll to zoom · Click any glowing pin
  </div>

  <!-- Three.js & Globe.gl -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/globe.gl@2.32.1/dist/globe.gl.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
